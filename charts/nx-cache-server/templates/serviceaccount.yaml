apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nx-cache-server.serviceAccountName" . | quote }}
  labels:
    {{- include "nx-cache-server.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn is required" .Values.serviceAccount.roleArn | quote }}
automountServiceAccountToken: false
