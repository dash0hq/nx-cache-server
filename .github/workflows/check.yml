name: Check
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: rustup show
      - run: make check
      - run: df -h . && free -h && docker info
      - run: make test-s3
      - run: make test-nx
