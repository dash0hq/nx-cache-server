name: 'Create GitHub Release'
description: 'Download artifacts, create tag, and publish GitHub release with assets'

inputs:
  version:
    description: 'Release version (e.g., v1.0.0)'
    required: true
  release-notes:
    description: 'Release notes content'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for creating releases'
    required: true

runs:
  using: composite
  steps:
    - name: Download all artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        path: artifacts
        pattern: nx-cache-aws-*

    - name: Prepare release assets and checksums
      shell: bash
      run: |
        mkdir -p release-assets
        find artifacts -name "nx-cache-aws*" -type f -exec cp {} release-assets/ \;
        test "$(find release-assets -type f | wc -l)" -eq 5
        cd release-assets
        sha256sum * > checksums.txt
        sha256sum --check checksums.txt

    - name: Create Release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ inputs.version }}
        RELEASE_NOTES: ${{ inputs.release-notes }}
      run: |
        printf '%s\n' "${RELEASE_NOTES:-Release $VERSION}" > release-notes.txt
        flags=()
        if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
        # Recheck immediately before publishing; never point a release at an existing tag.
        gh auth setup-git
        remote_tags=$(git ls-remote --tags origin "refs/tags/$VERSION")
        test -z "$remote_tags"
        gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
          --notes-file release-notes.txt "${flags[@]}" release-assets/*
