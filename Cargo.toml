[package]
name = "nx-cache-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dash0hq/nx-cache-server"

# AWS binary
[[bin]]
name = "nx-cache-aws"
path = "src/bin/aws.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "io-util", "macros", "fs", "signal"] }
tempfile = "3.27"
tokio-stream = "0.1"
axum = "0.8"
clap = { version = "4.0", features = ["derive", "env"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-http = "0.32"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
thiserror = "1.0"
subtle = "2.5"
aws-config = { version = "1.0", default-features = false }
aws-sdk-s3 = { version = "1.0", default-features = false, features = ["rt-tokio"] }
# TLS via rustls + ring instead of the SDK default aws-lc-rs, which pulls in
# aws-lc-sys (C/CMake/NASM toolchain) and breaks cross-platform release builds.
aws-smithy-http-client = { version = "1.1", default-features = false, features = ["rustls-ring"] }
aws-credential-types = "1.2.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true         # Remove all symbols
lto = true           # Link-time optimization  
codegen-units = 1    # Better optimization
panic = "abort"      # Don't include unwinding code
